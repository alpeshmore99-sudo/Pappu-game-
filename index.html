<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pappu Playing Picture - Casino Landscape 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #030712; color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 100vw; height: 100vh; overflow: hidden;
      display: flex; justify-content: center; align-items: center;
    }
    .game-wrapper {
      width: 100vw; height: 100vh; max-width: 850px; max-height: 450px;
      background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      border: 2px solid #d97706; display: flex; flex-direction: column;
      justify-content: space-between; padding: 4px 8px; position: relative;
      box-shadow: 0 0 20px rgba(217, 119, 6, 0.4);
    }
    
    .header-top {
      background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 2px 8px;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0; height: 36px;
    }
    .stat-group { display: flex; gap: 10px; align-items: center; }
    .stat-item { text-align: center; }
    .stat-label { font-size: 7px; color: #94a3b8; text-transform: uppercase; }
    .stat-val { font-size: 10px; font-weight: bold; color: #facc15; }
    .stat-val.time { color: #f87171; }
    
    .game-title { 
      font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
      background: linear-gradient(to bottom, #fef08a, #eab308, #ca8a04);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8)) drop-shadow(0 0 8px rgba(250, 204, 21, 0.6));
    }

    .game-body {
      display: flex; flex-direction: column; align-items: center;
      flex-grow: 1; justify-content: space-between; margin: 3px 0;
    }

    .wheel-container {
      position: relative; width: 50px; height: 50px; 
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      z-index: 50; flex-shrink: 0;
    }
    .wheel-container.popup-wheel { width: 75px; height: 75px; }
    canvas {
      width: 100%; height: 100%; border-radius: 50%;
      border: 2px solid #facc15; box-shadow: 0 0 8px rgba(250, 204, 21, 0.8);
      background: #1e1b4b;
    }
    .wheel-pointer {
      position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent;
      border-bottom: 6px solid #ef4444; z-index: 60;
    }

    #win-toast {
      text-align: center; background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; padding: 2px 10px; border-radius: 5px; font-size: 9px; font-weight: bold;
      box-shadow: 0 0 8px #22c55e; z-index: 60; display: none;
      position: absolute; bottom: 42px; left: 50%; transform: translateX(-50%);
      text-transform: uppercase;
    }

    .popup-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 7, 18, 0.7); z-index: 40; display: none;
      justify-content: center; align-items: center; flex-direction: column;
    }
    .popup-overlay.active { display: flex; }

    .symbols-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr);
      gap: 4px; width: 100%; flex-grow: 1;
    }

    .symbol-box {
      background: linear-gradient(to bottom, #1e293b, #0f172a); border: 1.5px solid #3b82f6;
      border-radius: 4px; padding: 2px; text-align: center; cursor: pointer; 
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      position: relative;
    }
    .symbol-box.active-touch {
      border-color: #facc15 !important; background: linear-gradient(to bottom, #3b82f6, #1d4ed8) !important;
      box-shadow: 0 0 6px #facc15; transform: scale(0.95);
    }
    .symbol-box.winner-flash {
      border-color: #22c55e !important; background: #064e3b !important;
    }
    .symbol-icon { font-size: 15px; line-height: 1.1; }
    .symbol-title { font-size: 7px; font-weight: bold; color: #e2e8f0; margin-top: 1px; }
    .symbol-bet-amt {
      background: #ef4444; color: #fff; font-size: 6px; font-weight: bold;
      border-radius: 3px; padding: 0 2px; display: inline-block; margin-top: 1px;
    }

    .footer-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; padding: 3px 8px; border-radius: 6px; border: 1px solid #334155;
      height: 36px; flex-shrink: 0;
    }
    .chips-row { display: flex; gap: 4px; }
    .chip-btn {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid #475569;
      font-weight: bold; font-size: 7px; cursor: pointer; display: flex; justify-content: center; align-items: center;
    }
    .chip-btn:nth-child(1) { background: #10b981; color: #fff; }
    .chip-btn:nth-child(2) { background: #3b82f6; color: #fff; }
    .chip-btn:nth-child(3) { background: #8b5cf6; color: #fff; }
    .chip-btn:nth-child(4) { background: #f59e0b; color: #fff; }
    .chip-btn:nth-child(5) { background: #ef4444; color: #fff; }
    .chip-btn.selected { border: 2px solid #facc15; transform: scale(1.1); box-shadow: 0 0 4px #facc15; }
    
    .action-buttons { display: flex; gap: 4px; }
    .action-btn { padding: 3px 10px; border-radius: 4px; font-weight: bold; font-size: 7px; border: none; cursor: pointer; color: white; text-transform: uppercase; }
    .btn-ok { background: #2563eb; }
    .btn-take { background: #059669; }
    .btn-cancel { background: #dc2626; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="popup-overlay" id="popup-overlay"></div>

    <div class="header-top">
      <div class="stat-group">
        <div class="stat-item"><div class="stat-label">पॉइंट्स</div><div class="stat-val" id="user-points">5000</div></div>
        <div class="stat-item"><div class="stat-label">वेळ</div><div class="stat-val time" id="user-timer">60</div></div>
      </div>
      <div class="game-title">Pappu Playing Picture</div>
      <div class="stat-group">
        <div class="stat-item"><div class="stat-label">बेट</div><div class="stat-val" id="total-bet">0</div></div>
        <div class="stat-item"><div class="stat-label">विजेता</div><div class="stat-val" id="last-winner">0</div></div>
      </div>
    </div>

    <div class="game-body">
      <div class="wheel-container" id="main-wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="250" height="250"></canvas>
      </div>
      <div class="symbols-grid" id="symbols-grid"></div>
    </div>

    <div id="win-toast">🎉 You Win! 🎉</div>

    <div class="footer-bar">
      <div class="chips-row">
        <button class="chip-btn selected" onclick="selectChip(5, this)">5</button>
        <button class="chip-btn" onclick="selectChip(10, this)">10</button>
        <button class="chip-btn" onclick="selectChip(50, this)">50</button>
        <button class="chip-btn" onclick="selectChip(100, this)">100</button>
        <button class="chip-btn" onclick="selectChip(500, this)">500</button>
      </div>
      <div class="action-buttons">
        <button class="action-btn btn-ok" onclick="submitBets()">ओके</button>
        <button class="action-btn btn-take" id="btn-take" onclick="takeWinnings()" disabled>टेक</button>
        <button class="action-btn btn-cancel" onclick="clearBets()">रद्द</button>
      </div>
    </div>
  </div>

  <script>
    var selectedChip = 5;
    var totalBetsMap = {}; 
    var userPoints = 5000;
    var wonAmount = 0;
    var isBettingClosed = false;
    var isBetLocked = false; 
    var holdInterval = null;
    var timeLeft = 60;
    var hasTakenWin = true;
    var currentWinningIndex = 0;
    var currentAngle = 0;
    var isSpinning = false;
    var spinAnimId = null;

    const SYMBOLS = [
      { key: 'ball', name: 'बॉल', icon: '⚽' },
      { key: 'sun', name: 'सूर्य', icon: '☀️' },
      { key: 'lamp', name: 'दिवा', icon: '🪔' },
      { key: 'cow', name: 'गाय', icon: '🐄' },
      { key: 'bucket', name: 'बादली', icon: '🪣' },
      { key: 'kite', name: 'पतंग', icon: '🪁' },
      { key: 'top', name: 'भोरा', icon: '🪀' },
      { key: 'flower', name: 'फूल', icon: '🌸' },
      { key: 'butterfly', name: 'फुलपाखरू', icon: '🦋' },
      { key: 'pigeon', name: 'कबुतर', icon: '🕊️' },
      { key: 'rabbit', name: 'ससा', icon: '🐇' },
      { key: 'chhatri', name: 'छत्री', icon: '☂️' }
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const totalSlices = SYMBOLS.length;
    const arcSize = (2 * Math.PI) / totalSlices;

    function drawWheel(angleOffset = 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let center = canvas.width / 2;
      let radius = center - 4;

      for (let i = 0; i < totalSlices; i++) {
        let startAngle = i * arcSize + angleOffset;
        let endAngle = (i + 1) * arcSize + angleOffset;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = (i % 2 === 0) ? '#7c3aed' : '#3b82f6';
        ctx.fill();
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2;
        ctx.stroke();

        let textAngle = startAngle + arcSize / 2;
        let textRadius = radius * 0.62;
        let x = center + Math.cos(textAngle) * textRadius;
        let y = center + Math.sin(textAngle) * textRadius;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(textAngle + Math.PI / 2);
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(SYMBOLS[i].icon, 0, 0);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(center, center, 32, 0, 2 * Math.PI);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#facc15';
      ctx.stroke();

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PAPPU', center, center - 6);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 8px sans-serif';
      ctx.fillText('PLAYING', center, center + 3);
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 7px sans-serif';
      ctx.fillText('PICTURE', center, center + 12);
    }

    function renderGrid() {
      var grid = document.getElementById('symbols-grid');
      grid.innerHTML = '';
      SYMBOLS.forEach(s => {
        let currentAmt = totalBetsMap[s.key] || 0;
        let box = document.createElement('div');
        box.className = 'symbol-box';
        box.id = 'box-' + s.key;
        
        box.addEventListener('mousedown', (e) => { e.preventDefault(); startHold(s.key, box); });
        box.addEventListener('mouseup', (e) => { e.preventDefault(); stopHold(box); });
        box.addEventListener('mouseleave', (e) => { e.preventDefault(); stopHold(box); });
        box.addEventListener('touchstart', (e) => { e.preventDefault(); startHold(s.key, box); }, {passive: false});
        box.addEventListener('touchend', (e) => { e.preventDefault(); stopHold(box); }, {passive: false});
        box.addEventListener('touchcancel', (e) => { e.preventDefault(); stopHold(box); }, {passive: false});

        box.innerHTML = '<div class="symbol-icon">' + s.icon + '</div>' +
          '<div class="symbol-title">' + s.name + '</div>' +
          '<div class="symbol-bet-amt" id="bet-' + s.key + '" style="display: ' + (currentAmt > 0 ? 'inline-block' : 'none') + ';">' + currentAmt + '</div>';
        grid.appendChild(box);
      });
    }

    function selectChip(amount, btn) {
      selectedChip = amount;
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function addSingleBet(key) {
      if (isBettingClosed || isBetLocked || !hasTakenWin) return;
      if (userPoints < selectedChip) { stopHold(); return; }

      userPoints -= selectedChip;
      document.getElementById('user-points').innerText = userPoints;
      
      if (!totalBetsMap[key]) totalBetsMap[key] = 0;
      totalBetsMap[key] += selectedChip;
      
      let total = 0;
      for (let k in totalBetsMap) total += totalBetsMap[k];
      document.getElementById('total-bet').innerText = total;
      
      let betEl = document.getElementById('bet-' + key);
      if(betEl) {
        betEl.innerText = totalBetsMap[key];
        betEl.style.display = 'inline-block';
      }
    }

    function startHold(key, boxElement) {
      if (!hasTakenWin) { alert('कृपया आधी मागील जिंकलेले पॉईंट्स "टेक" (Take) करा!'); return; }
      if (isBetLocked) { alert('तुमची बेट आधीच लॉक झाली आहे!'); return; }
      if (isBettingClosed) { alert('शेवटच्या १० सेकंदात बेट बंद आहे!'); return; }
      
      boxElement.classList.add('active-touch');
      addSingleBet(key);
      if (holdInterval) clearInterval(holdInterval);
      holdInterval = setInterval(() => {
        if (userPoints >= selectedChip) addSingleBet(key);
        else stopHold(boxElement);
      }, 150);
    }

    function stopHold(boxElement) {
      if (boxElement) boxElement.classList.remove('active-touch');
      if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
    }

    function clearBets() {
      if (isBetLocked || !hasTakenWin) return;
      let total = 0;
      for (let k in totalBetsMap) total += totalBetsMap[k];
      userPoints += total;
      totalBetsMap = {};
      document.getElementById('user-points').innerText = userPoints;
      document.getElementById('total-bet').innerText = '0';
      renderGrid();
    }

    function submitBets() {
      let total = 0;
      for (let k in totalBetsMap) total += totalBetsMap[k];
      if (total === 0) { alert('कृपया आधी बेट लावा!'); return; }
      isBetLocked = true; 
      alert('बेट यशस्वीरीत्या लॉक झाली!');
    }

    function takeWinnings() {
      if (wonAmount > 0) {
        userPoints += wonAmount; 
        document.getElementById('user-points').innerText = userPoints;
        wonAmount = 0;
        hasTakenWin = true;
        isBetLocked = false;
        
        let takeBtn = document.getElementById('btn-take');
        takeBtn.disabled = true;
        document.getElementById('win-toast').style.display = 'none';
        
        document.querySelectorAll('.symbol-box').forEach(b => b.classList.remove('winner-flash'));
        document.getElementById('main-wheel-container').classList.remove('popup-wheel');
        document.getElementById('popup-overlay').classList.remove('active');
        document.getElementById('last-winner').innerText = '0';
        
        totalBetsMap = {};
        document.getElementById('total-bet').innerText = '0';
        renderGrid();
      }
    }

    setInterval(() => {
      timeLeft--;
      if (timeLeft < 0) timeLeft = 60;
      document.getElementById('user-timer').innerText = timeLeft;
      
      if (timeLeft === 10) isBetLocked = true;
      
      if (timeLeft <= 10 && timeLeft > 5) {
        isBettingClosed = true;
        document.getElementById('main-wheel-container').classList.add('popup-wheel');
        document.getElementById('popup-overlay').classList.add('active');
        
        if (!isSpinning) {
          isSpinning = true;
          function spinStep() {
            currentAngle += 0.3;
            drawWheel(currentAngle);
            if (isSpinning) spinAnimId = requestAnimationFrame(spinStep);
          }
          spinStep();
        }
      } 
      else if (timeLeft === 5) {
        isSpinning = false;
        if (spinAnimId) cancelAnimationFrame(spinAnimId);

        document.getElementById('main-wheel-container').classList.add('popup-wheel');
        document.getElementById('popup-overlay').classList.add('active');
        
        currentWinningIndex = Math.floor(Math.random() * SYMBOLS.length);
        let winningSymbol = SYMBOLS[currentWinningIndex];

        currentAngle = - (currentWinningIndex * arcSize) - (arcSize / 2) - (Math.PI / 2);
        drawWheel(currentAngle);

        document.querySelectorAll('.symbol-box').forEach(b => b.classList.remove('winner-flash'));
        let winBox = document.getElementById('box-' + winningSymbol.key);
        if (winBox) winBox.classList.add('winner-flash');
        
        wonAmount = (totalBetsMap[winningSymbol.key] || 0) * 10;
        document.getElementById('last-winner').innerText = wonAmount;
        
        let takeBtn = document.getElementById('btn-take');
        if (wonAmount > 0) {
          hasTakenWin = false; 
          takeBtn.disabled = false;
          document.getElementById('win-toast').style.display = 'block';
        } else {
          hasTakenWin = true;
          takeBtn.disabled = true;
          document.getElementById('win-toast').style.display = 'none';
          
          setTimeout(() => {
            if (wonAmount === 0) {
              document.querySelectorAll('.symbol-box').forEach(b => b.classList.remove('winner-flash'));
              document.getElementById('main-wheel-container').classList.remove('popup-wheel');
              document.getElementById('popup-overlay').classList.remove('active');
              totalBetsMap = {};
              isBetLocked = false;
              renderGrid();
            }
          }, 3000);
        }
      }
      else if (timeLeft > 10) {
        isBettingClosed = false;
        isSpinning = false;
        document.getElementById('main-wheel-container').classList.remove('popup-wheel');
        document.getElementById('popup-overlay').classList.remove('active');
      }

      if (timeLeft === 60 && hasTakenWin) {
        wonAmount = 0;
        document.getElementById('last-winner').innerText = '0';
        let takeBtn = document.getElementById('btn-take');
        takeBtn.disabled = true;
        document.getElementById('win-toast').style.display = 'none';
        document.querySelectorAll('.symbol-box').forEach(b => b.classList.remove('winner-flash'));
        document.getElementById('main-wheel-container').classList.remove('popup-wheel');
        document.getElementById('popup-overlay').classList.remove('active');
        totalBetsMap = {};
        isBetLocked = false;
        renderGrid();
      }
    }, 1000);

    drawWheel(0);
    renderGrid();
  </script>
</body>
</html>
