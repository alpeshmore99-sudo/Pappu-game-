<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pappu Game - User Panel</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 10px;
      font-size: 16px;
    }
    h2 { color: #facc15; text-align: center; margin-bottom: 15px; font-size: 22px; }
    
    /* Login Section */
    #login-container {
      display: flex; justify-content: center; align-items: center; min-height: 90vh;
    }
    .login-card {
      background: #1e293b; padding: 25px; border-radius: 12px;
      width: 95%; max-width: 400px; border: 1px solid #334155;
    }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 15px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    .input-group input {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px;
    }
    button {
      padding: 12px; border: none; border-radius: 8px;
      font-weight: bold; cursor: pointer; background: #3b82f6; color: white; font-size: 16px; width: 100%;
    }

    /* Game Dashboard */
    #game-container { display: none; }
    .header-bar {
      background: #1e293b; padding: 15px; border-radius: 10px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
      border: 1px solid #334155; font-size: 18px;
    }
    .timer-box { color: #f87171; font-weight: bold; font-size: 20px; }
    .points-box { color: #facc15; font-weight: bold; font-size: 20px; }

    .grid-symbols {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
    }
    .symbol-card {
      background: #1e293b; border: 2px solid #334155; border-radius: 10px;
      padding: 15px 10px; text-align: center; cursor: pointer; transition: 0.2s;
    }
    .symbol-card:hover { border-color: #38bdf8; background: #131c31; }
    .symbol-name { font-size: 16px; font-weight: bold; color: #facc15; margin-bottom: 5px; }
    .symbol-bet { font-size: 14px; color: #38bdf8; }

    .bet-controls {
      background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center;
    }
    .chip-container { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
    .chip {
      background: #334155; color: #fff; border: none; padding: 8px 12px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; flex: 1;
    }
    .chip.selected { background: #10b981; border: 2px solid #fff; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-container">
    <div class="login-card">
      <h2>🎮 युझर लॉगिन</h2>
      <div class="input-group">
        <label>User ID</label>
        <input type="text" id="login-id" placeholder="उदा. PP12345678">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="पासवर्ड टाका">
      </div>
      <button onclick="loginUser()">लॉगिन करा</button>
      <p id="login-err" style="color:#ef4444; font-size:14px; margin-top:10px; text-align:center;"></p>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-container">
    <div class="header-bar">
      <div>टायमर: <span id="user-timer" class="timer-box">60</span>s</div>
      <div>पॉइंट्स: <span id="user-points" class="points-box">₹0</span></div>
    </div>

    <h2>चिन्हावर क्लिक करून बेट लावा</h2>
    <div class="grid-symbols" id="symbols-grid">
      <!-- Symbols will load dynamically -->
    </div>

    <div class="bet-controls">
      <p style="margin-bottom:10px; font-size:15px; color:#cbd5e1;">निवडलेली चिप रक्कम निवडा:</p>
      <div class="chip-container">
        <button class="chip selected" onclick="selectChip(10, this)">10</button>
        <button class="chip" onclick="selectChip(50, this)">50</button>
        <button class="chip" onclick="selectChip(100, this)">100</button>
        <button class="chip" onclick="selectChip(500, this)">500</button>
        <button class="chip" onclick="selectChip(1000, this)">1000</button>
      </div>
      <p id="selected-bet-info" style="color: #38bdf8; font-weight: bold; font-size: 15px;">निवडलेली रक्कम: ₹10</p>
    </div>
  </div>

  <script>
    var socket = io();
    var currentUserId = '';
    var selectedChipAmount = 10;

    const SYMBOLS = [
      { key: 'chhatri', name: 'छत्री (Umbrella)' },
      { key: 'ball', name: 'बॉल (Ball)' },
      { key: 'sun', name: 'सूर्य (Sun)' },
      { key: 'lamp', name: 'लंप (Lamp)' },
      { key: 'cow', name: 'गाय (Cow)' },
      { key: 'bucket', name: 'बकेट (Bucket)' },
      { key: 'kite', name: 'पतंग (Kite)' },
      { key: 'top', name: 'भोरा (Top)' },
      { key: 'flower', name: 'फुल (Flower)' },
      { key: 'butterfly', name: 'फुलपाखरू (Butterfly)' },
      { key: 'pigeon', name: 'कबुतर (Pigeon)' },
      { key: 'rabbit', name: 'ससा (Rabbit)' }
    ];

    function renderSymbols() {
      var grid = document.getElementById('symbols-grid');
      grid.innerHTML = '';
      SYMBOLS.forEach(s => {
        grid.innerHTML += `
          <div class="symbol-card" onclick="placeBet('${s.key}')">
            <div class="symbol-name">${s.name}</div>
            <div class="symbol-bet" id="bet-${s.key}">बेट: ₹0</div>
          </div>
        `;
      });
    }

    function selectChip(amount, btn) {
      selectedChipAmount = amount;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('selected-bet-info').innerText = 'निवडलेली रक्कम: ₹' + amount;
    }

    function loginUser() {
      var id = document.getElementById('login-id').value;
      var pass = document.getElementById('login-pass').value;
      
      // Temporary check (Backend authentication handler can be extended in server.js if needed)
      if (id && pass) {
        currentUserId = id;
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        renderSymbols();
      } else {
        document.getElementById('login-err').innerText = 'कृपया आयडी आणि पासवर्ड टाका!';
      }
    }

    function placeBet(symbolKey) {
      alert(symbolKey + ' वर ₹' .concat(selectedChipAmount, ' ची बेट लावली!'));
      // Socket event for betting can be linked here
    }

    socket.on('timer-update', function(time) {
      var tElem = document.getElementById('user-timer');
      if (tElem) tElem.innerText = time;
    });
  </script>
</body>
</html>
